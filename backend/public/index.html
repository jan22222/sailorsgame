<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sailors & Islands – Lobby</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
      integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      /* Big fixed help button */
      .help-button {
        position: fixed;
        right: 18px;
        bottom: 18px;
        width: 64px;
        height: 64px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        text-decoration: none;

        font-size: 34px;
        font-weight: 900;
        line-height: 1;

        border: 2px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        z-index: 999999;

        transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
        user-select: none;
      }

      .help-button:hover {
        transform: translateY(-2px) scale(1.03);
        background: rgba(0, 0, 0, 0.88);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      }

      .help-button:active {
        transform: translateY(0) scale(0.98);
      }

      /* Optional: kleine "Pulse"-Animation, damit man ihn wahrnimmt */
      .help-button::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        animation: helpPulse 1.8s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes helpPulse {
        0% { transform: scale(0.92); opacity: 0.2; }
        60% { transform: scale(1.08); opacity: 0.0; }
        100% { transform: scale(1.08); opacity: 0.0; }
      }
    </style>
	<style>
  body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
  }

  .join-container {
    max-width: 640px;        /* vorher 500px */
    width: 100%;
    transform: scale(1.15); /* 🔥 macht alles sofort größer */
    transform-origin: top center;
  }

  .join-header h1 {
    font-size: 34px;
    letter-spacing: 1px;
  }

  .join-main label {
    font-size: 18px;
  }

  .join-main input,
  .join-main select {
    font-size: 18px;
    height: 48px;
  }

  .join-main .btn {
    font-size: 20px;
    padding: 12px;
    margin-top: 10px;
  }

  /* OR in der Mitte größer */
  .or-separator {
    font-size: 80px;
    font-weight: 900;
    opacity: 0.4;
    margin: 0 30px;
  }

  /* Open Games Buttons */
  #roomsList button {
    font-size: 18px;
    padding: 12px;
  }
</style>

  </head>

  <body style="height: 100vh; display:flex; flex-direction:row; align-items:center; justify-content:space-around;">
    <!-- CREATE -->
    <div class="join-container">
      <header class="join-header">
        <h1>Create a game</h1>
      </header>
      <main class="join-main">
        <form action="settlers.html" method="GET">
          <input type="hidden" name="mode" value="create" />

          <div class="form-control">
            <label for="usernameCreate">Player</label>
            <input type="text" name="username" id="usernameCreate" placeholder="Enter username..." required />
          </div>

          <div class="form-control">
            <label for="quantity">Number of players (1 to 5)</label>
            <input type="number" id="quantity" name="quantity" min="1" max="5" value="2" required />
          </div>

          <div class="form-control">
            <label for="roomCreate">Room</label>
            <input type="text" name="room" id="roomCreate" placeholder="Enter gamename..." required />
          </div>

          <div class="form-control">
            <label for="landscape">Choose a landscape type:</label>
            <select id="landscape" name="landscape">
              <option value="normal">Normal</option>
              <option value="desert">Desert (low resources)</option>
              <option value="water">Islands (water)</option>
              <option value="rich">Rich</option>
            </select>
          </div>

          <div class="form-control">
            <button type="submit" class="btn">Create</button>
          </div>
        </form>
      </main>
    </div>

    <div class="or-separator">OR</div>

    <!-- JOIN (manual) -->
    <div class="join-container">
      <header class="join-header">
        <h1>Join a game</h1>
      </header>
      <main class="join-main">
        <form action="settlers.html" method="GET">
          <input type="hidden" name="mode" value="join" />

          <div class="form-control">
            <label for="roomJoin">Room</label>
            <input type="text" name="room" id="roomJoin" placeholder="Enter gamename..." required />
          </div>

          <div class="form-control">
            <label for="usernameJoin">Player</label>
            <input type="text" name="username" id="usernameJoin" placeholder="Enter username..." required />
          </div>

          <div class="form-control">
            <button type="submit" class="btn">Join</button>
          </div>
        </form>
      </main>

      <hr style="margin:18px 0; opacity:0.3" />

      <!-- OPEN GAMES LIST -->
      <header class="join-header">
        <h1>Open Games</h1>
      </header>
      <main class="join-main">
        <div id="roomsList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </main>
    </div>

    <!-- HELP BUTTON (rules) -->
    <a class="help-button" href="/rules.html" title="Rules / How to play">?</a>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qs@6.11.2/dist/qs.js"></script>
    <script src="/js/lobby.js"></script>
  </body>
</html>
